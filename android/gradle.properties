org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Play Console 권장: R8와 연동되는 최적화된 리소스 축소(AGP 8.10+, 9.0부터 기본).
android.enableOptimizedResourceShrinking=true
# AGP 9 업그레이드는 보류: battery_plus 등 KGP 방식 플러그인은 builtInKotlin=false를,
# file_picker 11 등 신형 플러그인은 내장 코틀린(true)을 요구해 AGP 9에서 양립 불가(2026-07).
# 플러그인 생태계가 내장 코틀린으로 넘어오면 AGP 9 재시도. 아래 두 플래그는 AGP 8에선
# 무시되지만, Flutter 마이그레이터가 매 빌드 재추가하는 것을 막기 위해 남겨 둔다.
android.newDsl=false
android.builtInKotlin=false
